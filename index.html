    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

      delete pendingFrames[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

his._mq.matches ? this.state.menuOpen : false });\n    this._mq.addEventListener(\"change\", this._mqh);\n    this._mqh();\n    this.animateCounters();\n    this.setupReveals();\n    this._proof = setInterval(() => {\n      this.setState({ proofOut: true });\n      this._proofT = setTimeout(() => this.setState((s) => ({ proof: (s.proof + 1) % 4, proofOut: false })), 300);\n    }, 3200);\n    this._tick = setInterval(() => {\n      this.setState({ tickOut: true });\n      this._tickT = setTimeout(() => this.setState((s) => ({ tick: (s.tick + 1) % TICKS.length, tickOut: false })), 260);\n    }, 2400);\n    if (this.motion === \"full\" && window.matchMedia(\"(hover: hover)\").matches) {\n      this._move = (e) => { if (this._glow) this._glow.style.transform = \"translate3d(\" + e.clientX + \"px,\" + e.clientY + \"px,0)\"; };\n      window.addEventListener(\"pointermove\", this._move, { passive: true });\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._move) window.removeEventListener(\"pointermove\", this._move);\n    if (this._mq) this._mq.removeEventListener(\"change\", this._mqh);\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._io) this._io.disconnect();\n    clearInterval(this._proof); clearTimeout(this._proofT); clearInterval(this._tick); clearTimeout(this._tickT);\n  }\n\n  animateCounters() {\n    const dur = this.motion === \"full\" ? 1500 : 1;\n    const start = performance.now();\n    const tick = (now) => {\n      const p = Math.min(1, (now - start) / dur);\n      this.setState({ t: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  setupReveals() {\n    if (this.motion !== \"full\" || typeof IntersectionObserver === \"undefined\") return;\n    const nodes = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    nodes.forEach((n) => { n.style.opacity = \"0\"; n.style.transform = \"translateY(18px)\"; n.style.transition = \"opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1)\"; });\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => { if (!e.isIntersecting) return; e.target.style.opacity = \"1\"; e.target.style.transform = \"none\"; this._io.unobserve(e.target); });\n    }, { rootMargin: \"0px 0px -8% 0px\", threshold: 0.05 });\n    nodes.forEach((n) => this._io.observe(n));\n  }\n\n  proofVals() {\n    const i = this.state.proof, n = i + 1, d = PROOF_DEFAULTS[i], p = this.props;\n    const name = p[\"proof\" + n + \"Name\"] ?? d[0];\n    const photo = (p[\"proof\" + n + \"Photo\"] || \"\").trim();\n    const initials = name.split(/\\s+/).map((w) => w[0] || \"\").join(\"\").slice(0, 2).toUpperCase();\n    return {\n      proofName: name,\n      proofResult: p[\"proof\" + n + \"Result\"] ?? d[1],\n      proofTime: p[\"proof\" + n + \"Time\"] ?? d[2],\n      proofInitials: photo ? \"\" : initials,\n      proofAvatarBg: photo ? \"url(\\\"\" + photo + \"\\\") center / cover\" : AVATAR_BG[i]\n    };\n  }\n\n  opts(key, list, color) {\n    return list.map(([val, label]) => {\n      const on = this.state[key] === val;\n      return { label, pick: () => this.setState({ [key]: val }), bg: on ? color : \"transparent\", color: on ? \"var(--onAcc)\" : \"var(--ink)\", border: on ? color : \"var(--line)\" };\n    });\n  }\n\n  renderVals() {\n    const t = this.state.t;\n    const theme = this.theme;\n    const acc = ACCENTS[this.props.accent] || ACCENTS[\"#ff6a4f\"];\n    const pair = acc[theme] || acc.dark;\n    const vars = Object.assign({}, THEMES[theme] || THEMES.dark, { \"--a1\": pair[0], \"--a2\": pair[1] });\n\n    const { q1, q2 } = this.state;\n    let res = null;\n    if (q1 && q2) {\n      if (q1 !== \"yes\") res = { title: \"1:1 Coaching\", text: q2 === \"no\" ? \"Media buying needs a store that's already profitable. Coaching gets you there first.\" : \"We'll teach you to launch and scale Pinterest on your own store.\", cta: \"Apply for 1:1 coaching\", color: \"var(--a2)\" };\n      else if (q2 === \"yes\") res = { title: \"1:1 Coaching\", text: \"Your store already works. We'll teach you to add Pinterest yourself.\", cta: \"Apply for 1:1 coaching\", color: \"var(--a2)\" };\n      else res = { title: \"Media buying\", text: \"Your store already converts. Hand us Pinterest and we'll run it.\", cta: \"Apply for media buying\", color: \"var(--a1)\" };\n    }\n\n    return {\n      shotOpen: this.state.shotOpen,\n      openShot: (e) => { if (e) e.preventDefault(); this.setState({ shotOpen: true }); },\n      closeShot: () => this.setState({ shotOpen: false }),\n      stopShot: (e) => e.stopPropagation(),\n      themeVars: vars,\n      ...this.proofVals(),\n      gaugeOffset: (282.7 * (1 - 0.64 * t)).toFixed(1),\n      dRevenue: money(284310 * t),\n      dSpend: money(44420 * t),\n      dCpa: \"$\" + (18.4 * t).toFixed(2),\n      dCampaigns: String(Math.round(12 * t)),\n      tickItem: TICKS[this.state.tick][0],\n      tickAmount: TICKS[this.state.tick][1],\n      tickOpacity: this.state.tickOut ? 0 : 1,\n      tickShift: this.state.tickOut ? \"5px\" : \"0px\",\n      proofOpacity: this.state.proofOut ? 0 : 1,\n      proofShift: this.state.proofOut ? \"6px\" : \"0px\",\n      themeLabel: theme === \"dark\" ? \"DARK\" : \"LIGHT\",\n      toggleTheme: () => this.setState({ theme: theme === \"dark\" ? \"light\" : \"dark\" }),\n      glowRef: (el) => { this._glow = el; },\n      isMobile: this.state.mobile,\n      isDesktop: !this.state.mobile,\n      menuOpen: this.state.mobile && this.state.menuOpen,\n      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      q1Opts: this.opts(\"q1\", [[\"yes\", \"Yes\"], [\"no\", \"Not yet\"], [\"none\", \"No store yet\"]], \"var(--a1)\"),\n      q2Opts: this.opts(\"q2\", [[\"yes\", \"Yes, teach me\"], [\"no\", \"No, run them for me\"]], \"var(--a1)\"),\n      showResult: !!res,\n      resTitle: res ? res.title : \"\",\n      resText: res ? res.text : \"\",\n      resCta: res ? res.cta : \"\",\n      resColor: res ? res.color : \"var(--a1)\",\n      faqs: FAQS.map((f, i) => ({ q: f.q, a: f.a, open: this.state.faq === i, icon: this.state.faq === i ? \"−\" : \"+\", toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i }) })),\n      roas: (3.1 * t).toFixed(1) + \"x\",\n      spend: \"$\" + (1.42 * t).toFixed(2) + \"M\",\n      spendBig: \"$\" + (14.2 * t).toFixed(1) + \"M\",\n      cpa: \"$\" + (18.4 * t).toFixed(2),\n      cpaDrop: \"−\" + Math.round(38 * t) + \"%\",\n      accounts: String(Math.round(23 * t)),\n      accountsBig: Math.round(60 * t) + \"+\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
